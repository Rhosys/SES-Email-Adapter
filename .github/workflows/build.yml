name: CI/CD Pipeline

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_llm_tests:
        description: 'Run LLM integration tests'
        type: boolean
        default: false

env:
  AWS_DEFAULT_REGION: "eu-central-1"
  STATE_BUCKET: "rhosys-opentofu-${{ secrets.AWS_ACCOUNT_ID }}-eu-central-1"
  STATE_KEY: "${{ github.event.repository.name }}/terraform.tfstate"
  TF_VAR_aws_account_id: "${{ secrets.AWS_ACCOUNT_ID }}"
  MINISTACK_VERSION: "1.3.59"

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  # ==========================================
  # PATH A: PULL REQUEST VALIDATION
  # ==========================================
  pr_validate:
    name: Validate PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          aws_region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Validate Code (strict type-check + tests)
        run: npm test

      - name: Tofu Init
        run: tofu -chdir=deploy init -input=false -backend-config="bucket=${STATE_BUCKET}" -backend-config="key=${STATE_KEY}"

      - name: Tofu Plan
        run: tofu -chdir=deploy plan -input=false -out=plan.cache

  # ==========================================
  # PATH C: INTEGRATION TESTS (MiniStack)
  # ==========================================
  mirror_ministack:
    name: Mirror MiniStack to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror ministack (idempotent)
        run: |
          VERSIONED="ghcr.io/rhosys/ministack:${{ env.MINISTACK_VERSION }}"
          if docker manifest inspect "$VERSIONED" > /dev/null 2>&1; then
            echo "GHCR already has ${{ env.MINISTACK_VERSION }}, skipping"
          else
            docker pull "ministackorg/ministack:${{ env.MINISTACK_VERSION }}"
            docker tag "ministackorg/ministack:${{ env.MINISTACK_VERSION }}" "$VERSIONED"
            docker tag "ministackorg/ministack:${{ env.MINISTACK_VERSION }}" "ghcr.io/rhosys/ministack:latest"
            docker push "$VERSIONED"
            docker push "ghcr.io/rhosys/ministack:latest"
          fi

  integration_test:
    name: Integration Test
    needs: mirror_ministack
    runs-on: ubuntu-latest

    services:
      ministack:
        # Version controlled via MINISTACK_VERSION env var — update mirror_ministack job when bumping
        image: ghcr.io/rhosys/ministack:latest
        ports:
          - 4566:4566

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: '1.12.0'

      - name: Install dependencies
        run: npm ci

      - name: Wait for MiniStack
        run: |
          echo "Waiting for MiniStack on port 4566..."
          until curl -s http://localhost:4566 -o /dev/null; do
            sleep 1
          done
          echo "MiniStack ready."

      - name: Provision Integration Test Infrastructure via Tofu
        run: |
          mkdir -p /tmp/itf/secrets
          cp deploy/*.tf /tmp/itf/
          cp deploy/integration/providers.tf /tmp/itf/providers.tf
          echo -n "dummy" > /tmp/itf/secrets/dkim-private-key.kms
          # Remove single-line attributes MiniStack doesn't support at the emulation layer.
          # These are operational/replication features; they don't affect the table schema
          # (key attributes, GSIs) that the application code depends on.
          sed -i '/replica { region_name/d' /tmp/itf/storage.tf
          sed -i '/point_in_time_recovery { enabled = true }/d' /tmp/itf/storage.tf
          sed -i '/deletion_protection_enabled/d' /tmp/itf/storage.tf
          sed -i '/stream_enabled\|stream_view_type/d' /tmp/itf/storage.tf
          tofu -chdir=/tmp/itf init -reconfigure -input=false
          tofu -chdir=/tmp/itf apply -auto-approve -input=false -refresh=false \
            -target=aws_dynamodb_table.accounts \
            -target=aws_dynamodb_table.signals \
            -target=aws_dynamodb_table.processing \
            -target=aws_dynamodb_table.audit
        env:
          AWS_ACCESS_KEY_ID: ministack-test
          AWS_SECRET_ACCESS_KEY: ministack-test

      - name: Read resource names from Tofu outputs
        id: tofu_outputs
        run: |
          echo "ACCOUNTS_TABLE=$(tofu -chdir=/tmp/itf output -raw dynamodb_accounts_table)" >> $GITHUB_OUTPUT
          echo "SIGNALS_TABLE=$(tofu -chdir=/tmp/itf output -raw dynamodb_signals_table)" >> $GITHUB_OUTPUT
          echo "PROCESSING_TABLE=$(tofu -chdir=/tmp/itf output -raw dynamodb_processing_table)" >> $GITHUB_OUTPUT
          echo "AUDIT_TABLE=$(tofu -chdir=/tmp/itf output -raw dynamodb_audit_table)" >> $GITHUB_OUTPUT
        env:
          AWS_ACCESS_KEY_ID: ministack-test
          AWS_SECRET_ACCESS_KEY: ministack-test

      - name: Run integration tests
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: ministack-test
          AWS_SECRET_ACCESS_KEY: ministack-test
          AWS_REGION: eu-central-1
          ACCOUNTS_TABLE: ${{ steps.tofu_outputs.outputs.ACCOUNTS_TABLE }}
          SIGNALS_TABLE: ${{ steps.tofu_outputs.outputs.SIGNALS_TABLE }}
          PROCESSING_TABLE: ${{ steps.tofu_outputs.outputs.PROCESSING_TABLE }}
          AUDIT_TABLE: ${{ steps.tofu_outputs.outputs.AUDIT_TABLE }}
          AUTHRESS_API_URL: http://localhost:4500
          EMAIL_BUCKET: ses-it-email
          CONTENT_BUCKET: ses-it-content
          SIGNAL_QUEUE_URL: http://localhost:4566/000000000000/ses-it-signals
          CONTENT_CDN_BASE_URL: http://localhost:4566/ses-it-content
        run: |
          npx tsx tests/integration/post-accounts.ts
          npx tsx tests/integration/email-roundtrip.ts

  # ==========================================
  # PATH B: PRODUCTION BUILD & PLAN
  # ==========================================
  prod_build_and_plan:
    name: Prod Build & Plan
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      requires_approval: ${{ steps.plan_check.outputs.requires_approval }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          aws_region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Build Code
        run: npm run build

      - name: Test Code
        run: npm run check

      - name: Tofu Init
        run: tofu -chdir=deploy init -input=false -backend-config="bucket=${STATE_BUCKET}" -backend-config="key=${STATE_KEY}"

      - name: Tofu Plan
        id: plan
        run: |
          set +e
          tofu -chdir=deploy plan -input=false -out=plan.cache 2>&1 | tee /tmp/plan_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "## ❌ Tofu Plan Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -A2 '│ Error:' /tmp/plan_output.txt | sed 's/\x1B\[[0-9;]*[mGKHF]//g' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          fi
        env:
          TF_LOG: ${{ github.event_name == 'workflow_dispatch' && 'TRACE' || '' }}

      - name: Convert Plan to JSON
        run: tofu -chdir=deploy show -json plan.cache > deploy/plan.json

      - name: Check for Destructive Changes
        id: plan_check
        run: |
          tofu -chdir=deploy show plan.cache > /tmp/plan_text.txt

          DESTROYS=$(jq '[.resource_changes[]? | select(.change.actions | contains(["delete"]))] | length' deploy/plan.json)

          echo "Found $DESTROYS destructive changes."

          if [ "$DESTROYS" -gt 0 ]; then
            echo "requires_approval=true" >> $GITHUB_OUTPUT

            echo "## ⚠️ DESTRUCTIVE CHANGES DETECTED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**$DESTROYS resource(s) will be destroyed or replaced.** Routing to manual approval." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            npx tsx deploy/summarise-destructive-changes.ts

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "👉 [Review & Approve Deployment](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "requires_approval=false" >> $GITHUB_OUTPUT
            echo "✅ No destructive changes. Routing to auto-deploy." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Plan Summary
        run: |
          curl -sL https://github.com/dineshba/tf-summarize/releases/latest/download/tf-summarize_linux_amd64.tar.gz | tar xz
          echo "## Plan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ./tf-summarize -md deploy/plan.json >> $GITHUB_STEP_SUMMARY

      - name: Pass Artifacts to Deploy Job
        uses: actions/upload-artifact@v7
        with:
          name: prod-artifacts
          path: |
            deploy/plan.cache
            deploy/plan.json
            deploy/.terraform/lambda-stub.zip
            dist/
          retention-days: 1

  # ==========================================
  # PATH B: PRODUCTION DEPLOY (Gated)
  # ==========================================
  prod_deploy:
    name: Prod Deploy
    needs: [prod_build_and_plan, integration_test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency: production
    environment:
      name: ${{ needs.prod_build_and_plan.outputs.requires_approval == 'true' && 'dangerous-infrastructure-deployment' || 'production-auto' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          aws_region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Retrieve Artifacts
        uses: actions/download-artifact@v8
        with:
          name: prod-artifacts

      - name: Tofu Init
        run: tofu -chdir=deploy init -input=false -backend-config="bucket=${STATE_BUCKET}" -backend-config="key=${STATE_KEY}"

      - name: Read Tofu Outputs
        id: tofu_outputs
        run: |
          tofu -chdir=deploy output -json | jq -r 'to_entries[] | "\(.key)=\(.value.value)"' >> $GITHUB_OUTPUT

      - name: Tofu Apply
        id: apply
        run: |
          set +e
          tofu -chdir=deploy apply -input=false -auto-approve plan.cache 2>&1 | tee /tmp/apply_output.txt
          echo ${PIPESTATUS[0]} > /tmp/apply_exit_code.txt
          exit $(cat /tmp/apply_exit_code.txt)

      - name: Deploy Application Code
        id: deploy
        env:
          LAMBDA_FUNCTION_NAME: ${{ steps.tofu_outputs.outputs.lambda_function_name }}
          USER_CODE_EXECUTOR_FUNCTION_NAME: ${{ steps.tofu_outputs.outputs.user_code_executor_function_name }}
          CONTENT_SANITIZER_FUNCTION_NAME: ${{ steps.tofu_outputs.outputs.content_sanitizer_function_name }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: npm run deploy

      - name: Deployment Summary
        if: always()
        run: |
          EXIT_CODE=$(cat /tmp/apply_exit_code.txt 2>/dev/null || echo "0")
          DEPLOY_OUTCOME="${{ steps.deploy.outcome }}"
          if [ "$EXIT_CODE" = "0" ] && [ "$DEPLOY_OUTCOME" = "success" ]; then
            echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          if [ "$EXIT_CODE" = "0" ] && [ "$DEPLOY_OUTCOME" != "success" ]; then
            echo "## ❌ Deploy Application Code Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Tofu apply succeeded but \`npm run deploy\` failed. Check the step log for details." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "## ❌ Tofu Apply Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if grep -q "AccessDenied\|is not authorized to perform\|explicit deny" /tmp/apply_output.txt; then
            echo "## 🚨🚨🚨 MANUAL DELETION REQUIRED 🚨🚨🚨" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The CI role does not have permission to delete resources." >> $GITHUB_STEP_SUMMARY
            echo "This is **intentional** — destructive operations require human credentials." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**⚠️ WARNING: The following commands permanently destroy AWS resources. Data loss is irreversible.**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**WHY this is safe:** The tofu code no longer references these resources." >> $GITHUB_STEP_SUMMARY
            echo "They are orphaned infrastructure that was intentionally removed from the codebase." >> $GITHUB_STEP_SUMMARY
            echo "The tool validates that the resource is in state but absent from .tf code before deleting." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            RESOURCES=$(grep -oP '(?<=resource ")[^"]+\.[^"]+(?=")' /tmp/apply_output.txt | sort -u)
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo "# Run from _tools/ with your local AWS credentials:" >> $GITHUB_STEP_SUMMARY
            for addr in $RESOURCES; do
              echo "npx tsx src/delete-tf-resource.ts --deploy-dir $(pwd)/deploy --resource \"$addr\" --region ${AWS_DEFAULT_REGION}" >> $GITHUB_STEP_SUMMARY
            done
            if [ -z "$RESOURCES" ]; then
              echo "# Could not auto-extract resource addresses. Check the error below and run:" >> $GITHUB_STEP_SUMMARY
              echo "# npx tsx src/delete-tf-resource.ts --deploy-dir $(pwd)/deploy --resource \"<address>\" --region ${AWS_DEFAULT_REGION}" >> $GITHUB_STEP_SUMMARY
            fi
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "After running, re-trigger this workflow." >> $GITHUB_STEP_SUMMARY
          else
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -50 /tmp/apply_output.txt | sed 's/\x1B\[[0-9;]*[mGKHF]//g' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  # ==========================================
  # MANUAL: LLM Integration Tests
  # ==========================================
  llm_tests:
    name: LLM Integration Tests
    if: github.event_name == 'workflow_dispatch' && inputs.run_llm_tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          aws_region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Run LLM Tests
        run: npm run test:llm
