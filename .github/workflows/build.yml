name: CI/CD Pipeline

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_DEFAULT_REGION: "eu-central-1"
  STATE_BUCKET: "rhosys-opentofu-${{ secrets.AWS_ACCOUNT_ID }}-eu-central-1"
  STATE_KEY: "${{ github.event.repository.name }}/terraform.tfstate"
  TF_VAR_aws_account_id: "${{ secrets.AWS_ACCOUNT_ID }}"
  TF_VAR_service_name: "${{ github.event.repository.name }}"

permissions:
  id-token: write
  contents: read

jobs:
  # ==========================================
  # PATH A: PULL REQUEST VALIDATION
  # ==========================================
  pr_validate:
    name: Validate PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          aws_region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Build Code
        run: npm run build

      - name: Test Code
        run: npm test

      - name: Migrate Tofu State
        run: |
          OLD_BUCKET="${STATE_BUCKET/eu-central-1/eu-west-1}"
          if aws s3 ls "s3://${STATE_BUCKET}/${STATE_KEY}" > /dev/null 2>&1; then
            echo "State already exists in ${STATE_BUCKET} — skipping migration."
          else
            echo "State not found in ${STATE_BUCKET}, copying from ${OLD_BUCKET}..."
            aws s3 cp "s3://${OLD_BUCKET}/${STATE_KEY}" "s3://${STATE_BUCKET}/${STATE_KEY}"
          fi

      - name: Tofu Init
        run: tofu -chdir=deploy init -input=false -backend-config="bucket=${STATE_BUCKET}" -backend-config="key=${STATE_KEY}"

      - name: Orphan eu-west-1 State (one-time migration)
        run: |
          MARKER="s3://${STATE_BUCKET}/migration/eu-west-1-orphaned"
          if aws s3 ls "$MARKER" > /dev/null 2>&1; then
            echo "eu-west-1 orphan migration already complete — skipping."
            exit 0
          fi
          RESOURCES=$(tofu -chdir=deploy state list 2>/dev/null || true)
          if [ -z "$RESOURCES" ]; then
            echo "State is empty — marking migration as done."
            echo "" | aws s3 cp - "$MARKER"
            exit 0
          fi
          # Keep global/us-east-1 resources: IAM, ACM, CloudFront, Route53, random
          KEEP="^(aws_iam_|aws_acm_|aws_cloudfront_|aws_route53_|random_)"
          TO_REMOVE=$(echo "$RESOURCES" | grep -vE "$KEEP" || true)
          if [ -z "$TO_REMOVE" ]; then
            echo "No regional resources in state — marking migration as done."
            echo "" | aws s3 cp - "$MARKER"
            exit 0
          fi
          echo "→ Orphaning eu-west-1 regional resources from state:"
          while IFS= read -r addr; do
            echo "   removing: $addr"
            tofu -chdir=deploy state rm "$addr" 2>/dev/null || echo "   (already removed)"
          done <<< "$TO_REMOVE"
          echo "" | aws s3 cp - "$MARKER"
          echo "✓ Done. Old eu-west-1 resources are now unmanaged in AWS."

      - name: Fix eu-central-1 Migration State (one-time)
        run: |
          MARKER="s3://${STATE_BUCKET}/migration/eu-central-1-state-fixed"
          if aws s3 ls "$MARKER" > /dev/null 2>&1; then
            echo "Post-migration state fix already applied — skipping."
            exit 0
          fi
          # The api_gateways ACM cert was kept by the orphan step (matches aws_acm_*)
          # but it lives in eu-west-1. Drop it so Tofu recreates it in eu-central-1.
          # (aws_acm_certificate.api uses provider=us_east_1 and is intentionally kept.)
          echo "→ Removing eu-west-1 API Gateway cert from state..."
          tofu -chdir=deploy state rm aws_acm_certificate.api_gateways 2>/dev/null || echo "  (already absent)"
          tofu -chdir=deploy state rm aws_acm_certificate_validation.api_gateways 2>/dev/null || echo "  (already absent)"
          CERT_RECORDS=$(tofu -chdir=deploy state list 2>/dev/null | grep '^aws_route53_record\.api_gateways_cert_validation' || true)
          while IFS= read -r addr; do
            [ -z "$addr" ] && continue
            tofu -chdir=deploy state rm "$addr" 2>/dev/null || echo "  (already absent)"
          done <<< "$CERT_RECORDS"
          # DynamoDB tables already exist in eu-central-1 (they were replicas of the eu-west-1
          # primary). Check state first so we distinguish "already imported" from import failure.
          echo "→ Importing existing DynamoDB tables..."
          for table in accounts signals processing; do
            addr="aws_dynamodb_table.${table}"
            if tofu -chdir=deploy state show "$addr" > /dev/null 2>&1; then
              echo "  $addr already in state — skipping"
            else
              echo "  Importing $addr ..."
              tofu -chdir=deploy import "$addr" "${TF_VAR_service_name}-${table}"
              echo "  ✓ $addr imported"
            fi
          done
          echo "" | aws s3 cp - "$MARKER"
          echo "✓ Post-migration state fix applied."

      - name: Tofu Plan
        run: tofu -chdir=deploy plan -input=false -out=plan.cache

  # ==========================================
  # PATH B: PRODUCTION BUILD & PLAN
  # ==========================================
  prod_build_and_plan:
    name: Prod Build & Plan
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      requires_approval: ${{ steps.plan_check.outputs.requires_approval }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          aws_region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Build Code
        run: npm run build

      - name: Test Code
        run: npm test

      - name: Migrate Tofu State
        run: |
          OLD_BUCKET="${STATE_BUCKET/eu-central-1/eu-west-1}"
          if aws s3 ls "s3://${STATE_BUCKET}/${STATE_KEY}" > /dev/null 2>&1; then
            echo "State already exists in ${STATE_BUCKET} — skipping migration."
          else
            echo "State not found in ${STATE_BUCKET}, copying from ${OLD_BUCKET}..."
            aws s3 cp "s3://${OLD_BUCKET}/${STATE_KEY}" "s3://${STATE_BUCKET}/${STATE_KEY}"
          fi

      - name: Tofu Init
        run: tofu -chdir=deploy init -input=false -backend-config="bucket=${STATE_BUCKET}" -backend-config="key=${STATE_KEY}"

      - name: Orphan eu-west-1 State (one-time migration)
        run: |
          MARKER="s3://${STATE_BUCKET}/migration/eu-west-1-orphaned"
          if aws s3 ls "$MARKER" > /dev/null 2>&1; then
            echo "eu-west-1 orphan migration already complete — skipping."
            exit 0
          fi
          RESOURCES=$(tofu -chdir=deploy state list 2>/dev/null || true)
          if [ -z "$RESOURCES" ]; then
            echo "State is empty — marking migration as done."
            echo "" | aws s3 cp - "$MARKER"
            exit 0
          fi
          # Keep global/us-east-1 resources: IAM, ACM, CloudFront, Route53, random
          KEEP="^(aws_iam_|aws_acm_|aws_cloudfront_|aws_route53_|random_)"
          TO_REMOVE=$(echo "$RESOURCES" | grep -vE "$KEEP" || true)
          if [ -z "$TO_REMOVE" ]; then
            echo "No regional resources in state — marking migration as done."
            echo "" | aws s3 cp - "$MARKER"
            exit 0
          fi
          echo "→ Orphaning eu-west-1 regional resources from state:"
          while IFS= read -r addr; do
            echo "   removing: $addr"
            tofu -chdir=deploy state rm "$addr" 2>/dev/null || echo "   (already removed)"
          done <<< "$TO_REMOVE"
          echo "" | aws s3 cp - "$MARKER"
          echo "✓ Done. Old eu-west-1 resources are now unmanaged in AWS."

      - name: Fix eu-central-1 Migration State (one-time)
        run: |
          MARKER="s3://${STATE_BUCKET}/migration/eu-central-1-state-fixed"
          if aws s3 ls "$MARKER" > /dev/null 2>&1; then
            echo "Post-migration state fix already applied — skipping."
            exit 0
          fi
          # The api_gateways ACM cert was kept by the orphan step (matches aws_acm_*)
          # but it lives in eu-west-1. Drop it so Tofu recreates it in eu-central-1.
          # (aws_acm_certificate.api uses provider=us_east_1 and is intentionally kept.)
          echo "→ Removing eu-west-1 API Gateway cert from state..."
          tofu -chdir=deploy state rm aws_acm_certificate.api_gateways 2>/dev/null || echo "  (already absent)"
          tofu -chdir=deploy state rm aws_acm_certificate_validation.api_gateways 2>/dev/null || echo "  (already absent)"
          CERT_RECORDS=$(tofu -chdir=deploy state list 2>/dev/null | grep '^aws_route53_record\.api_gateways_cert_validation' || true)
          while IFS= read -r addr; do
            [ -z "$addr" ] && continue
            tofu -chdir=deploy state rm "$addr" 2>/dev/null || echo "  (already absent)"
          done <<< "$CERT_RECORDS"
          # DynamoDB tables already exist in eu-central-1 (they were replicas of the eu-west-1
          # primary). Check state first so we distinguish "already imported" from import failure.
          echo "→ Importing existing DynamoDB tables..."
          for table in accounts signals processing; do
            addr="aws_dynamodb_table.${table}"
            if tofu -chdir=deploy state show "$addr" > /dev/null 2>&1; then
              echo "  $addr already in state — skipping"
            else
              echo "  Importing $addr ..."
              tofu -chdir=deploy import "$addr" "${TF_VAR_service_name}-${table}"
              echo "  ✓ $addr imported"
            fi
          done
          echo "" | aws s3 cp - "$MARKER"
          echo "✓ Post-migration state fix applied."

      - name: Tofu Plan
        id: plan
        run: |
          set +e
          tofu -chdir=deploy plan -input=false -out=plan.cache 2>&1 | tee /tmp/plan_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "## ❌ Tofu Plan Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -A2 '│ Error:' /tmp/plan_output.txt | sed 's/\x1B\[[0-9;]*[mGKHF]//g' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          fi
        env:
          TF_LOG: ${{ github.event_name == 'workflow_dispatch' && 'TRACE' || '' }}

      - name: Convert Plan to JSON
        run: tofu -chdir=deploy show -json plan.cache > deploy/plan.json

      - name: Check for Destructive Changes
        id: plan_check
        run: |
          tofu -chdir=deploy show plan.cache > /tmp/plan_text.txt

          DESTROYS=$(jq '[.resource_changes[]? | select(.change.actions | contains(["delete"]))] | length' deploy/plan.json)

          echo "Found $DESTROYS destructive changes."

          if [ "$DESTROYS" -gt 0 ]; then
            echo "requires_approval=true" >> $GITHUB_OUTPUT

            echo "## ⚠️ DESTRUCTIVE CHANGES DETECTED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**$DESTROYS resource(s) will be destroyed or replaced.** Routing to manual approval." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            npx tsx deploy/summarise-destructive-changes.ts

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "👉 [Review & Approve Deployment](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "requires_approval=false" >> $GITHUB_OUTPUT
            echo "✅ No destructive changes. Routing to auto-deploy." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Plan Summary
        run: |
          curl -sL https://github.com/dineshba/tf-summarize/releases/latest/download/tf-summarize_linux_amd64.tar.gz | tar xz
          echo "## Plan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ./tf-summarize -md deploy/plan.json >> $GITHUB_STEP_SUMMARY

      - name: Pass Artifacts to Deploy Job
        uses: actions/upload-artifact@v4
        with:
          name: prod-artifacts
          path: |
            deploy/plan.cache
            deploy/plan.json
            deploy/.terraform/lambda-stub.zip
            dist/
          retention-days: 1

  # ==========================================
  # PATH B: PRODUCTION DEPLOY (Gated)
  # ==========================================
  prod_deploy:
    name: Prod Deploy
    needs: prod_build_and_plan
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency: production
    environment: 
      name: ${{ needs.prod_build_and_plan.outputs.requires_approval == 'true' && 'production-gated' || 'production-auto' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          aws_region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Retrieve Artifacts
        uses: actions/download-artifact@v4
        with:
          name: prod-artifacts

      - name: Tofu Init
        run: tofu -chdir=deploy init -input=false -backend-config="bucket=${STATE_BUCKET}" -backend-config="key=${STATE_KEY}"

      - name: Read Tofu Outputs
        id: tofu_outputs
        run: |
          tofu -chdir=deploy output -json | jq -r 'to_entries[] | "\(.key)=\(.value.value)"' >> $GITHUB_OUTPUT

      - name: Tofu Apply
        id: apply
        run: |
          set +e
          tofu -chdir=deploy apply -input=false -auto-approve plan.cache 2>&1 | tee /tmp/apply_output.txt
          echo ${PIPESTATUS[0]} > /tmp/apply_exit_code.txt
          exit $(cat /tmp/apply_exit_code.txt)

      - name: Deployment Summary
        if: always()
        run: |
          EXIT_CODE=$(cat /tmp/apply_exit_code.txt 2>/dev/null || echo "0")
          if [ "$EXIT_CODE" = "0" ]; then
            echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "## ❌ Tofu Apply Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if grep -q "AccessDenied\|is not authorized to perform\|explicit deny" /tmp/apply_output.txt; then
            echo "## 🚨🚨🚨 MANUAL DELETION REQUIRED 🚨🚨🚨" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The CI role does not have permission to delete resources." >> $GITHUB_STEP_SUMMARY
            echo "This is **intentional** — destructive operations require human credentials." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**⚠️ WARNING: The following commands permanently destroy AWS resources. Data loss is irreversible.**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**WHY this is safe:** The tofu code no longer references these resources." >> $GITHUB_STEP_SUMMARY
            echo "They are orphaned infrastructure that was intentionally removed from the codebase." >> $GITHUB_STEP_SUMMARY
            echo "The tool validates that the resource is in state but absent from .tf code before deleting." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            RESOURCES=$(grep -oP '(?<=resource ")[^"]+\.[^"]+(?=")' /tmp/apply_output.txt | sort -u)
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo "# Run from _tools/ with your local AWS credentials:" >> $GITHUB_STEP_SUMMARY
            for addr in $RESOURCES; do
              echo "npx tsx src/delete-tf-resource.ts --deploy-dir $(pwd)/deploy --resource \"$addr\" --region ${AWS_DEFAULT_REGION}" >> $GITHUB_STEP_SUMMARY
            done
            if [ -z "$RESOURCES" ]; then
              echo "# Could not auto-extract resource addresses. Check the error below and run:" >> $GITHUB_STEP_SUMMARY
              echo "# npx tsx src/delete-tf-resource.ts --deploy-dir $(pwd)/deploy --resource \"<address>\" --region ${AWS_DEFAULT_REGION}" >> $GITHUB_STEP_SUMMARY
            fi
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "After running, re-trigger this workflow." >> $GITHUB_STEP_SUMMARY
          else
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -50 /tmp/apply_output.txt | sed 's/\x1B\[[0-9;]*[mGKHF]//g' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Deploy Application Code
        env:
          LAMBDA_FUNCTION_NAME: ${{ steps.tofu_outputs.outputs.lambda_function_name }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: npm run deploy